name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Package
        run: make release VERSION="$RELEASE_VERSION"
      - name: Verify distribution
        env:
          STACKHARBOR_RELEASE_TEST: '1'
        run: |
          STACKHARBOR_RELEASE_VERSION="$RELEASE_VERSION" go test ./tests -run '^TestRelease' -count=1
          cd dist && sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/stackharbor_"$RELEASE_VERSION"_*.tar.gz dist/SHA256SUMS \
            --verify-tag --latest --title "StackHarbor $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
      - name: Annotate historical version numbering error
        if: env.RELEASE_VERSION == '0.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.1 --json body --jq .body > /tmp/stackharbor-legacy-notes.md
          python3 - <<'PYNOTES'
          from pathlib import Path
          p = Path('/tmp/stackharbor-legacy-notes.md')
          notice = "> **Version numbering correction:** v2.0.1 was misnumbered. StackHarbor remains in the 0.x development phase. Use [v0.3.0](https://github.com/szhjia/stackharbor/releases/tag/v0.3.0) or a later supported 0.x release. This historical tag and its assets are retained for traceability.\n\n"
          body = p.read_text()
          if not body.startswith(notice):
              p.write_text(notice + body)
          PYNOTES
          gh release edit v2.0.1 --latest=false --title "StackHarbor v2.0.1 (misnumbered; superseded by v0.3.0)" --notes-file /tmp/stackharbor-legacy-notes.md
