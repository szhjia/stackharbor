name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  macos:
    needs: check
    uses: ./.github/workflows/desktop.yml
    with:
      public_release: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  publish:
    needs: [check, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Package
        run: make release VERSION="$RELEASE_VERSION"
      - name: Verify distribution
        env:
          STACKHARBOR_RELEASE_TEST: '1'
        run: |
          STACKHARBOR_RELEASE_VERSION="$RELEASE_VERSION" go test ./tests -run '^TestRelease' -count=1
          cd dist && sha256sum -c SHA256SUMS
      - name: Download verified signed macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stackharbor-macos-*-signed
          path: dist/macos
      - name: Validate and stage both public DMGs
        run: python3 scripts/stage-macos-release.py --directory dist/macos --output dist --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/stackharbor_"$RELEASE_VERSION"_linux_*.tar.gz dist/StackHarbor_"$RELEASE_VERSION"_*.dmg dist/desktop-*-build.json dist/SHA256SUMS \
            --verify-tag --latest --title "StackHarbor $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
      - name: Remove erroneous historical release and tag
        if: env.RELEASE_VERSION == '0.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.0.1 --cleanup-tag --yes
